  <ellipse cx="600" cy="315" rx="520" ry="230" fill="none" stroke="rgba(216,180,254,0.08)" stroke-width="2" stroke-dasharray="10 14" transform="rotate(-10 600 315)"/>
  <ellipse cx="600" cy="315" rx="430" ry="180" fill="none" stroke="rgba(217,70,239,0.10)" stroke-width="2" stroke-dasharray="6 12" transform="rotate(8 600 315)"/>

